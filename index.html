  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    /* ── Fixed photo background ── */
    /* MOBILE — single image, centered pan */
    @keyframes bgPanMobile {
      0%, 100% { background-position: 30% 50%; }
      50%       { background-position: 70% 50%; }
    }
    /* DESKTOP — two-image seamless loop (AR 5.1446, 72vh → 370.4vh per copy) */
    @keyframes bgPanDesktop {
      from { background-position: 0px 50%, 370.4vh 50%; }
      to   { background-position: -370.4vh 50%, 0px 50%; }
    }
    /* MOBILE — centred band, no mask */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image: url('background.jpg');
      background-size: auto 62%;
      background-repeat: no-repeat;
      background-position: 30% 50%;
      z-index: -2;
      animation: bgPanMobile 90s ease-in-out infinite;
    }
    /* DESKTOP — centred band with fade + seamless loop */
    @media (min-width: 720px) {
      body::before {
        background-image: url('background.jpg'), url('background.jpg');
        background-size: auto 72%, auto 72%;
        background-repeat: no-repeat, no-repeat;
        background-position: 0px 50%, 370.4vh 50%;
        mask-image: linear-gradient(to bottom, transparent 0%, black 28%, black 72%, transparent 100%);
        -webkit-mask-image: linear-gradient(to bottom, transparent 0%, black 28%, black 72%, transparent 100%);
        animation: bgPanDesktop 120s linear infinite;
      }
    }
    body::after {
      content: '';
      position: fixed;
      inset: 0;
      background: linear-gradient(to right, rgba(0,0,0,0.68) 0%, rgba(0,0,0,0.50) 38%, rgba(0,0,0,0.12) 100%);
      z-index: -1;
      transition: background 0.4s ease;
    }
    body.lighter::after { background: rgba(255, 255, 255, 0.30); }

    /* Desktop — dark ribbon covering the left content zone, fades right */
    @media (min-width: 720px) {
      body::after {
        background: linear-gradient(to right,
          transparent 0%,
          rgba(0,0,0,0.86) 12%,
          rgba(0,0,0,0.78) 38%,
          rgba(0,0,0,0.54) 54%,
          rgba(0,0,0,0.14) 70%,
          transparent 84%);
      }
    }

    /* ── Light mode text overrides ── */
    body.lighter                        { color: #111111; }
    body.lighter .name                  { color: #0a0a0a; }
    body.lighter .handle                { color: rgba(0,0,0,0.45); }
    body.lighter .alias                 { background: rgba(0,0,0,0.06); color: rgba(0,0,0,0.5); border-color: rgba(0,0,0,0.1); }
    body.lighter hr                     { border-color: rgba(0,0,0,0.1); }
    body.lighter .section-label         { color: rgba(0,0,0,0.32); }
    body.lighter .link-btn              { color: rgba(0,0,0,0.72); }
    body.lighter .link-btn:hover        { background: rgba(0,0,0,0.06); color: #000000; }
    body.lighter .icon-wrap             { background: rgba(0,0,0,0.07); }
    body.lighter .link-btn:hover .icon-wrap { background: rgba(0,0,0,0.12); }
    body.lighter .overlay-btn           { background: rgba(0,0,0,0.06); border-color: rgba(0,0,0,0.12); color: rgba(0,0,0,0.45); }
    body.lighter .overlay-btn:hover     { background: rgba(0,0,0,0.12); color: rgba(0,0,0,0.75); }
    body.lighter .rg-text               { color: #1aaa9e; }
    body.lighter .avatar                { border-color: rgba(0,0,0,0.18); background: rgba(0,0,0,0.06); }
    body.lighter .avatar-initials       { color: rgba(0,0,0,0.5); }

    body {
      font-family: 'Roboto', -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      min-height: 100svh;
      color: #f0f0f0;
      background-color: #060606;
    }

    /* ══════════════════════════════
       MOBILE — single column
    ══════════════════════════════ */
    .page {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      padding: 56px 32px 52px 32px;
      min-height: 100svh;
    }

    .profile {
      text-align: left;
      width: 100%;
      max-width: 340px;
      margin-bottom: 36px;
      animation: fadeUp 0.5s cubic-bezier(0.22,1,0.36,1) both;
    }

    .links-section {
      width: 100%;
      max-width: 340px;
      padding: 12px 14px;
      animation: fadeUp 0.5s 0.08s cubic-bezier(0.22,1,0.36,1) both;
    }

    /* ══════════════════════════════
       DESKTOP — two columns
    ══════════════════════════════ */
    @media (min-width: 720px) {
      .page {
        flex-direction: row;
        align-items: flex-start;
        justify-content: flex-start;
        gap: 52px;
        padding: 88px 56px 72px clamp(80px, 14vw, 220px);
      }

      .profile {
        position: sticky;
        top: 88px;
        text-align: left;
        margin-bottom: 0;
        flex-shrink: 0;
        width: 180px;
        max-width: 180px;
        padding: 18px 16px;
      }

      .profile .avatar    { margin-left: 0; margin-right: 0; }
      .profile .aliases   { justify-content: flex-start; }

      .links-section {
        max-width: 300px;
        flex: none;
        min-width: 0;
        padding: 14px 16px;
      }
    }

    /* ── Avatar ── */
    .avatar {
      width: 92px;
      height: 92px;
      border-radius: 50%;
      margin: 0 auto 18px;
      overflow: hidden;
      position: relative;
      border: 1.5px solid rgba(255,255,255,0.2);
      background: rgba(255,255,255,0.1);
      transition: border-color 0.3s;
    }
    .avatar:hover { border-color: rgba(255,255,255,0.45); }

    #avatarImg { width: 100%; height: 100%; object-fit: cover; display: none; }
    #avatarImg.loaded { display: block; }

    .avatar-initials {
      position: absolute; inset: 0;
      display: flex; align-items: center; justify-content: center;
      font-size: 26px; font-weight: 600; letter-spacing: -1.5px;
      color: rgba(255,255,255,0.6);
    }
    .avatar.has-photo .avatar-initials { display: none; }

    /* ── Name / handle ── */
    .name {
      font-size: 21px;
      font-weight: 700;
      letter-spacing: -0.2px;
      color: #ffffff;
      margin-bottom: 5px;
    }
    .handle {
      font-size: 13px;
      font-weight: 500;
      color: rgba(255,255,255,0.6);
      margin-bottom: 14px;
    }

    /* ── Alias pills ── */
    .aliases {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
      justify-content: center;
    }
    .alias {
      font-size: 10.5px;
      padding: 3px 9px;
      border-radius: 100px;
      background: rgba(255,255,255,0.08);
      color: rgba(255,255,255,0.48);
      border: 1px solid rgba(255,255,255,0.1);
      letter-spacing: 0.1px;
    }

    /* ── Divider ── */
    hr {
      border: none;
      border-top: 1px solid rgba(255,255,255,0.1);
      margin: 28px 0;
    }

    /* ── Section labels ── */
    .section-label {
      font-size: 9.5px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1.4px;
      color: rgba(255,255,255,0.55);
      padding: 0 8px;
      margin-bottom: 4px;
    }

    /* ── Link buttons ── */
    .links { display: flex; flex-direction: column; }

    .link-btn {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 9px 8px;
      border-radius: 10px;
      text-decoration: none;
      color: rgba(255,255,255,0.92);
      transition: background 0.13s ease, color 0.13s ease, transform 0.13s ease;
    }
    .link-btn:hover {
      background: rgba(255,255,255,0.09);
      color: #ffffff;
      transform: translateX(3px);
    }

    .icon-wrap {
      width: 30px;
      height: 30px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      background: rgba(255,255,255,0.08);
      transition: background 0.13s ease;
    }
    .link-btn:hover .icon-wrap { background: rgba(255,255,255,0.14); }
    .icon-wrap svg { width: 16px; height: 16px; }

    .link-label { flex: 1; font-size: 14px; font-weight: 500; }

    /* Icon colours — brightened for dark bg */
    .yt   svg { fill: #FF5555; }
    .ig   svg { fill: #E87CB0; }
    .tw   svg { fill: #dddddd; }
    .li   svg { fill: #6AABF7; }
    .vm   svg { fill: #5DD4F0; }
    .ps   svg { fill: #C8D4DC; }
    .gs   svg { fill: #7AB6FF; }
    .oc   svg { fill: #C8E86A; }
    .bl   svg { fill: #E8845A; }
    .gdb  svg { fill: #9B72CF; }
    .imd  svg { fill: #F5C518; }
    .cv   svg { fill: #A8C8F8; }

    .rg-text {
      font-size: 11px; font-weight: 800;
      color: #4DDDD0; letter-spacing: -0.5px;
    }

    .fl-icon { display: flex; gap: 3px; align-items: center; }
    .fl-icon span { display: block; width: 8px; height: 8px; border-radius: 50%; }
    .fl-dot-pink { background: #FF70AB; }
    .fl-dot-blue { background: #5599EE; }

    /* ── Mobile: profile fixed at top ── */
    @media (max-width: 719px) {
      .profile {
        position: fixed;
        top: 0; left: 0; right: 0;
        z-index: 100;
        max-width: 100%;
        width: 100%;
        margin-bottom: 0;
        padding: 10px 20px;
        display: flex;
        flex-direction: row;
        align-items: center;
        gap: 14px;
        text-align: left;
        background: rgba(6, 6, 6, 0.78);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        border-bottom: 1px solid rgba(255,255,255,0.10);
        animation: none;
      }
      .profile .avatar {
        width: 40px; height: 40px;
        flex-shrink: 0;
        margin: 0;
      }
      .profile .avatar-initials { font-size: 14px; letter-spacing: -1px; }
      .profile .name  { font-size: 15px; margin-bottom: 1px; }
      .profile .handle { font-size: 11px; margin-bottom: 0; }
      .profile .aliases { display: none; }
      .profile .footer { margin-top: 0; margin-left: auto; }

      /* Offset page content below the fixed bar (~64px tall) */
      .page { padding-top: 74px; }

      /* Light mode: white frosted header */
      body.lighter .profile {
        background: rgba(255,255,255,0.82);
        border-bottom-color: rgba(0,0,0,0.10);
      }
    }

    /* ── Footer / toggle ── */
    .footer { margin-top: 32px; text-align: center; }
    @media (min-width: 720px) { .footer { text-align: left; } }

    .overlay-btn {
      background: rgba(255,255,255,0.07);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 100px;
      padding: 6px 14px;
      font-size: 11.5px;
      color: rgba(255,255,255,0.45);
      cursor: pointer;
      font-family: inherit;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      transition: background 0.13s, color 0.13s;
    }
    .overlay-btn:hover {
      background: rgba(255,255,255,0.13);
      color: rgba(255,255,255,0.8);
    }

    /* ── Entrance animation ── */
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(14px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* ── Staggered link entrance ── */
    .link-btn {
      opacity: 0;
      animation: fadeUp 0.4s cubic-bezier(0.22,1,0.36,1) forwards;
    }
    .link-btn:nth-child(1)  { animation-delay: 0.12s; }
    .link-btn:nth-child(2)  { animation-delay: 0.17s; }
    .link-btn:nth-child(3)  { animation-delay: 0.22s; }
    .link-btn:nth-child(4)  { animation-delay: 0.27s; }
    .link-btn:nth-child(5)  { animation-delay: 0.32s; }
    .link-btn:nth-child(6)  { animation-delay: 0.37s; }
    .link-btn:nth-child(7)  { animation-delay: 0.42s; }
    .link-btn:nth-child(8)  { animation-delay: 0.47s; }
    .link-btn:nth-child(9)  { animation-delay: 0.52s; }
    .link-btn:nth-child(10) { animation-delay: 0.57s; }
  </style>
</head>

  let lighter = false;
  function toggleOverlay() {
    lighter = !lighter;
    document.body.classList.toggle('lighter', lighter);
