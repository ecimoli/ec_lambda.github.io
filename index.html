<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Dr Emiliano Cimoli — @ec_lambda">
  <title>Dr Emiliano Cimoli</title>
  <style>
    :root {
      --bg:         #f0f0f5;
      --dot:        rgba(0,0,0,0.055);
      --card:       #ffffff;
      --text:       #1c1c1e;
      --sub:        #6c6c70;
      --border:     rgba(0,0,0,0.07);
      --shadow:     0 4px 64px rgba(0,0,0,0.10), 0 1px 4px rgba(0,0,0,0.05);
      --btn:        #f7f7f9;
      --btn-hover:  #ececf1;
      --btn-border: rgba(0,0,0,0.08);
      --pill:       #efeff2;
      --pill-text:  #86868b;
    }
    [data-theme="dark"] {
      --bg:         #000000;
      --dot:        rgba(255,255,255,0.04);
      --card:       #1c1c1e;
      --text:       #f5f5f7;
      --sub:        #98989d;
      --border:     rgba(255,255,255,0.08);
      --shadow:     0 4px 64px rgba(0,0,0,0.7), 0 1px 4px rgba(0,0,0,0.5);
      --btn:        #2c2c2e;
      --btn-hover:  #3a3a3c;
      --btn-border: rgba(255,255,255,0.08);
      --pill:       #2c2c2e;
      --pill-text:  #98989d;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      background-color: var(--bg);
      background-image: radial-gradient(var(--dot) 1px, transparent 1px);
      background-size: 22px 22px;
      color: var(--text);
      min-height: 100svh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 28px 16px;
      transition: background-color 0.3s ease, color 0.3s ease;
    }

    /* ── Card ── */
    .card {
      background: var(--card);
      border-radius: 28px;
      padding: 40px 28px 28px;
      width: 100%;
      max-width: 400px;
      box-shadow: var(--shadow);
      border: 1px solid var(--border);
      transition: background 0.3s ease, box-shadow 0.3s ease;
      animation: fadeUp 0.4s cubic-bezier(0.22,1,0.36,1) both;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(14px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* ── Profile ── */
    .profile {
      text-align: center;
      margin-bottom: 28px;
    }

    .avatar {
      width: 86px;
      height: 86px;
      border-radius: 50%;
      margin: 0 auto 16px;
      position: relative;
      overflow: hidden;
      background: linear-gradient(135deg, #1c1c1e 0%, #48484a 100%);
      box-shadow: 0 0 0 3px var(--card), 0 0 0 5px var(--border);
    }
    [data-theme="dark"] .avatar {
      background: linear-gradient(135deg, #e5e5ea 0%, #aeaeb2 100%);
    }

    #avatarImg {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: none;
    }
    #avatarImg.loaded { display: block; }

    .avatar-initials {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 25px;
      font-weight: 700;
      letter-spacing: -1.5px;
      color: #f5f5f7;
    }
    [data-theme="dark"] .avatar-initials { color: #1c1c1e; }
    .avatar.has-photo .avatar-initials { display: none; }

    .name {
      font-size: 20px;
      font-weight: 700;
      letter-spacing: -0.5px;
      margin-bottom: 4px;
    }
    .handle {
      font-size: 13.5px;
      color: var(--sub);
      margin-bottom: 12px;
    }

    /* Alias pills */
    .aliases {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
      justify-content: center;
    }
    .alias {
      font-size: 11px;
      padding: 3px 9px;
      border-radius: 100px;
      background: var(--pill);
      color: var(--pill-text);
      font-weight: 500;
      letter-spacing: 0.1px;
      border: 1px solid var(--btn-border);
    }

    /* Divider */
    .divider {
      height: 1px;
      background: var(--border);
      margin: 24px 0;
    }

    /* ── Links ── */
    .links {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 22px;
    }

    .link-btn {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 11px 13px;
      border-radius: 14px;
      text-decoration: none;
      color: var(--text);
      background: var(--btn);
      border: 1px solid var(--btn-border);
      transition: transform 0.13s ease, box-shadow 0.13s ease, background 0.13s ease;
    }
    .link-btn:hover {
      background: var(--btn-hover);
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(0,0,0,0.09);
    }
    .link-btn:active { transform: translateY(0); box-shadow: none; }

    .icon-wrap {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .icon-wrap svg { width: 18px; height: 18px; }

    .link-label { flex: 1; font-size: 14.5px; font-weight: 500; }
    .link-arrow  { font-size: 16px; color: var(--sub); }

    /* Section labels */
    .section-label {
      font-size: 10.5px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.9px;
      color: var(--sub);
      margin: 18px 0 8px 2px;
      opacity: 0.7;
    }
    .section-label:first-child { margin-top: 0; }

    /* RG text icon */
    .rg-text {
      font-size: 12px;
      font-weight: 800;
      color: #fff;
      letter-spacing: -0.5px;
      font-family: inherit;
    }

    /* Platform colours */
    .yt .icon-wrap { background: #FF0000; }
    .ig .icon-wrap { background: linear-gradient(135deg, #833AB4 0%, #FD1D1D 50%, #F56040 100%); }
    .tw .icon-wrap { background: #000; }
    .li .icon-wrap { background: #0A66C2; }
    .vm .icon-wrap { background: #1AB7EA; }
    .fl .icon-wrap { background: #fff; border: 1.5px solid rgba(0,0,0,0.09); }
    .ps .icon-wrap { background: #003087; }
    .gs .icon-wrap { background: #4285F4; }
    .rg .icon-wrap { background: #00CCBB; }
    .oc .icon-wrap { background: #A6CE39; }

    [data-theme="dark"] .tw .icon-wrap { background: #e7e7e7; }
    [data-theme="dark"] .fl .icon-wrap { background: #2c2c2e; border-color: rgba(255,255,255,0.1); }

    .yt svg, .ig svg, .vm svg, .li svg, .ps svg, .gs svg, .oc svg { fill: #fff; }
    .tw svg { fill: #fff; }
    [data-theme="dark"] .tw svg { fill: #000; }

    /* ── Theme toggle ── */
    .toggle-wrap { display: flex; justify-content: center; }
    .theme-btn {
      background: var(--btn);
      border: 1px solid var(--btn-border);
      border-radius: 100px;
      padding: 7px 15px;
      cursor: pointer;
      font-size: 12.5px;
      color: var(--sub);
      font-family: inherit;
      display: flex;
      align-items: center;
      gap: 5px;
      transition: background 0.15s;
    }
    .theme-btn:hover { background: var(--btn-hover); }

    @media (max-width: 390px) {
      .card { padding: 32px 18px 24px; border-radius: 20px; }
    }
  </style>
</head>

<script>
  // Avatar: show photo if found, fall back to initials
  const img = document.getElementById('avatarImg');
  const av  = document.getElementById('avatar');
  img.addEventListener('load',  () => { img.classList.add('loaded'); av.classList.add('has-photo'); });
  img.addEventListener('error', () => img.remove());

  // Theme
  const root = document.documentElement;
  const icon = document.getElementById('themeIcon');
  const text = document.getElementById('themeText');

  function applyTheme(t) {
    root.setAttribute('data-theme', t);
    localStorage.setItem('ec-theme', t);
    icon.textContent = t === 'dark' ? '☀️' : '🌙';
    text.textContent = t === 'dark' ? 'Light mode' : 'Dark mode';
  }
  function toggleTheme() {
    applyTheme(root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark');
  }

  const saved = localStorage.getItem('ec-theme');
  if (saved) {
    applyTheme(saved);
  } else if (window.matchMedia('(prefers-color-scheme: dark)').matches) {
    applyTheme('dark');
  }
  window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', e => {
    if (!localStorage.getItem('ec-theme')) applyTheme(e.matches ? 'dark' : 'light');
  });
</script>
